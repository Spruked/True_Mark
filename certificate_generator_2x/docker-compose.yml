services:
  truemark-forge:
    build:
      context: ..
      dockerfile: certificate_generator_2x/Dockerfile
    container_name: truemark-forge
    image: truemark-forge:v2.0
    
    volumes:
      # The one authoritative local Vault persists all forge outputs,
      # examples, audit data, secrets, and future registry handoffs.
      - ../True_Mark_Vault_System:/app/True_Mark_Vault_System
    
    environment:
      - VAULT_BASE_PATH=/app/True_Mark_Vault_System
      - VAULT_MODE=local
      - PYTHONPATH=/app
      - SKG_ENABLED=true
      - SKG_DRIFT_THRESHOLD=0.7
    
    # Keep container running for interactive commands
    stdin_open: true
    tty: true
    
    # Optional: Expose port for future web API
    # ports:
    #   - "8000:8000"
    
    restart: unless-stopped
    
    command: tail -f /dev/null

  # Optional: Add a web dashboard service in the future
  # truemark-dashboard:
  #   build:
  #     context: ./dashboard
  #     dockerfile: Dockerfile
  #   container_name: truemark-dashboard
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - truemark-forge
  #   environment:
  #     - API_URL=http://truemark-forge:8000

networks:
  default:
    name: truemark-network
