version: '3.8'

services:
  truemark-forge:
    build:
      context: ..
      dockerfile: certificate_generator_2x/Dockerfile
    container_name: truemark-forge
    image: truemark-forge:v2.0
    
    volumes:
      # Mount output directories to persist generated certificates
      - ../True_Mark_Vault_System/certificates/issued:/app/True_Mark_Vault_System/certificates/issued
      - ../True_Mark_Vault_System/vault_logs:/app/True_Mark_Vault_System/vault_logs
      - ../True_Mark_Vault_System/swarm_queue:/app/True_Mark_Vault_System/swarm_queue
      - ../True_Mark_Vault_System/vault_system/skg_core/skg_data:/app/True_Mark_Vault_System/vault_system/skg_core/skg_data
    
    environment:
      - VAULT_BASE_PATH=/app/True_Mark_Vault_System
      - VAULT_MODE=mock
      - PYTHONPATH=/app
      - SKG_ENABLED=true
      - SKG_DRIFT_THRESHOLD=0.7
    
    # Keep container running for interactive commands
    stdin_open: true
    tty: true
    
    # Optional: Expose port for future web API
    # ports:
    #   - "8000:8000"
    
    restart: unless-stopped
    
    command: tail -f /dev/null

  # Optional: Add a web dashboard service in the future
  # truemark-dashboard:
  #   build:
  #     context: ./dashboard
  #     dockerfile: Dockerfile
  #   container_name: truemark-dashboard
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - truemark-forge
  #   environment:
  #     - API_URL=http://truemark-forge:8000

networks:
  default:
    name: truemark-network
